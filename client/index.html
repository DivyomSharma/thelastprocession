<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕯 The Last Procession</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    #game-container {
      position: relative;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .input-overlay {
      pointer-events: auto;
      background: rgba(10, 10, 15, 0.95);
      border: 1px solid #cc8844;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .input-overlay h3 {
      color: #cc8844;
      margin-bottom: 5px;
      font-size: 16px;
    }

    .input-overlay input {
      background: #1e1e2a;
      border: 1px solid #444455;
      color: #ddccaa;
      padding: 8px;
      font-family: 'Courier New', monospace;
      outline: none;
      text-align: center;
    }

    .input-overlay input:focus {
      border-color: #cc8844;
    }

    .input-overlay button {
      background: #2a2a3a;
      border: 1px solid #665544;
      color: #bbaa88;
      padding: 8px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      transition: all 0.2s;
    }

    .input-overlay button:hover {
      background: #3a3a4a;
      color: #ddccaa;
      border-color: #886655;
    }
  </style>
</head>

<body>
  <div id="game-container"></div>
  <div id="ui-layer"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
